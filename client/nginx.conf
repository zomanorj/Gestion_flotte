# Sert le build React et relaie l'API + Socket.io vers le conteneur backend
server {
  listen 80;
  root /usr/share/nginx/html;

  # Upload de documents : 10 Mo max côté API
  client_max_body_size 11m;

  # Compression des réponses texte (JS, CSS, JSON de l'API)
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://server:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.io : polling + upgrade WebSocket
  location /socket.io/ {
    proxy_pass http://server:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  # Fichiers du build : leur nom contient une empreinte du contenu, ils ne changent jamais.
  # Cache d'un an ; un fichier absent répond 404 (jamais index.html à la place d'un script).
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Routage SPA (React Router). index.html n'est jamais mis en cache : après un déploiement,
  # le navigateur découvre immédiatement les nouveaux fichiers.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
