# Intégration continue : lint + tests backend, build frontend, build et démarrage de la stack Docker.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle exécution sur la même branche annule la précédente
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest --silent"
          --health-interval=5s --health-timeout=3s --health-retries=30
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        env:
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_PORT: 3306
          TEST_MYSQL_USER: root
          TEST_MYSQL_PASSWORD: test
        run: pytest --junitxml=rapport-tests.xml

      - name: Rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests-backend
          path: server/rapport-tests.xml

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run build
      - name: Budget de taille du premier chargement
        run: npm run verifier:taille

  docker:
    name: Stack Docker (build + démarrage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build et démarrage
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Vérification de bout en bout via nginx
        run: |
          curl --fail --silent http://localhost:8080/api/health
          curl --fail --silent --output /dev/null http://localhost:8080/
          TOKEN=$(curl --fail --silent http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@flotte.mg","password":"password123"}' | python3 -c "import sys, json; print(json.load(sys.stdin)['token'])")
          curl --fail --silent --output /dev/null -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/dashboard/stats
          curl --fail --silent --output /dev/null "http://localhost:8080/socket.io/?EIO=4&transport=polling"

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs

      - name: Arrêt
        if: always()
        run: docker compose down --volumes
