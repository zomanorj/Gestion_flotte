# Configuration Alembic (migrations du schéma de la base)
#
# L'API applique les migrations elle-même au démarrage. En ligne de commande, depuis server/ :
#   alembic history                       liste des révisions
#   alembic current                       révision de la base configurée (variables DB_* ou MYSQL_URL)
#   alembic revision -m "description"     nouvelle révision dans migrations/versions/
#   alembic upgrade head | downgrade -1   appliquer / défaire
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = [%(name)s] %(message)s
